name: app_finanzas
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_dotenv: ^5.2.1
  http: ^1.3.0
  shared_preferences: ^2.5.2
  provider: ^6.1.2
  currency_text_input_formatter: ^2.2.8
  flutter_launcher_icons: ^0.14.3
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/playstore.png" # Ruta del ícono (debe ser de 1024x1024 px)
  adaptive_icon_background: "#f8f9fa" # Color de fondo (Android)
  adaptive_icon_foreground: "assets/playstore.png"

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/svgs/
    - .env.development
    - .env.production